name: iOS release to TestFlight

# Archives the iPhone app, signs it with Apple's automatic signing and uploads
# it to App Store Connect, where it appears in TestFlight and can be submitted
# for review. Run it by hand from the Actions tab.
#
# It needs five repository secrets, created once in GitHub (Settings ->
# Secrets and variables -> Actions), from the Apple Developer account:
#   APPLE_TEAM_ID       the 10-character Team ID (developer.apple.com -> Membership)
#   ASC_KEY_ID          an App Store Connect API key's Key ID
#   ASC_ISSUER_ID       the Issuer ID shown above the keys list
#   ASC_KEY_P8_BASE64   the downloaded AuthKey_XXXX.p8 file, base64-encoded
# The key needs the App Manager role. Nothing here prints or stores them.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (must go up with every upload)"
        required: true
        default: "1"

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate the Xcode project
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Put the App Store Connect key in place
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Archive
        working-directory: iosApp
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project PrayerKey.xcodeproj -scheme PrayerKey -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/PrayerKey.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.event.inputs.build_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Upload to App Store Connect
        working-directory: iosApp
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/PrayerKey.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf ~/private_keys
