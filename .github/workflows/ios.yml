name: iOS build

# The iPhone app is built from the same Kotlin as Android (android/shared and
# android/ui), and Kotlin can only compile for iPhone on a Mac. This runs on
# GitHub's macOS machines for the ios-port branch; nothing here signs or ships.
#
# Compiler errors and simulator screenshots are posted as annotations, so they
# can be read from the public API without a signed-in session.
on:
  push:
    branches: [ios-port]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Compile shared code and screens for iPhone
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('android/build.gradle.kts') }}

      - name: Compile for the iPhone simulator and devices
        working-directory: android
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --continue \
            :shared:compileKotlinIosSimulatorArm64 \
            :ui:compileKotlinIosSimulatorArm64 \
            :shared:compileKotlinIosArm64 \
            :ui:compileKotlinIosArm64 2>&1 | tee build.log

      - name: Report compiler errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |What went wrong|Could not resolve|> " build.log | sed 's#file:///Users/runner/work/PrayerKey/PrayerKey/android/##' | sort -u > errors.txt || true
          split -l 40 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Kotlin (iOS)::$msg"
          done

      - name: Run the shared tests on the iPhone simulator
        working-directory: android
        run: bash ./gradlew --no-daemon :shared:iosSimulatorArm64Test

  app:
    name: Build the iPhone app and run it in the simulator
    needs: kotlin
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('android/build.gradle.kts') }}

      - name: Generate the Xcode project
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild -project PrayerKey.xcodeproj -scheme PrayerKey -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcode.log | grep -E "error:|warning: .*PrayerKey|BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/PrayerKey.app

      - name: Report build errors
        if: failure()
        working-directory: iosApp
        run: |
          grep -E "error:|^e: |What went wrong" xcode.log | sort -u | head -120 > errors.txt || true
          split -l 40 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Xcode::$msg"
          done

      - name: Launch in the simulator and take screenshots
        working-directory: iosApp
        run: |
          # iPhone 16 Pro Max: its screenshots are the 6.9-inch size App Store Connect requires
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone 16 Pro Max \(" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/PrayerKey.app
          mkdir -p screenshots
          # first launch as a new person: the welcome
          xcrun simctl launch --console-pty "$DEVICE" com.prayerkey.manna > console.log 2>&1 &
          sleep 15
          xcrun simctl io "$DEVICE" screenshot screenshots/0-welcome.png
          if ! xcrun simctl spawn "$DEVICE" launchctl list | grep -q com.prayerkey.manna; then
            msg=$(tail -60 console.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=The app stopped::$msg"
            exit 1
          fi
          # then as a returning person, one screen per launch
          n=1
          for route in home bible prayer devotional journal church; do
            xcrun simctl terminate "$DEVICE" com.prayerkey.manna || true
            xcrun simctl launch "$DEVICE" com.prayerkey.manna -demo -route "$route" >> console.log 2>&1
            sleep 14
            xcrun simctl io "$DEVICE" screenshot "screenshots/$n-$route.png"
            n=$((n + 1))
          done

      - name: Publish the screenshots to the ios-screenshots branch
        if: always()
        working-directory: iosApp
        run: |
          # full-size PNGs, readable at raw.githubusercontent.com without signing in
          ls screenshots/*.png > /dev/null 2>&1 || exit 0
          cp -r screenshots /tmp/shots
          cp console.log /tmp/shots/ || true
          cd /tmp/shots
          git init -q -b ios-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Simulator screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ios-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator
          path: |
            iosApp/screenshots
            iosApp/console.log
          if-no-files-found: ignore
