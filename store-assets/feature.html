<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PrayerKey feature graphic</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@600;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; color: #fff; font-family: "Playfair Display", Georgia, serif;
    background:
      radial-gradient(ellipse 45% 70% at 76% 60%, rgba(243, 207, 122, .22), transparent 70%),
      radial-gradient(ellipse 60% 80% at 10% 0%, rgba(120, 60, 255, .38), transparent 70%),
      linear-gradient(135deg, #2B0B62 0%, #1C0745 55%, #0F0426 100%);
  }
  .copy { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 470px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
  .brand img { width: 58px; height: 58px; }
  .brand span { font-weight: 700; font-size: 26px; letter-spacing: .3em; }
  h1 { font-weight: 600; font-size: 64px; line-height: 1.05; }
  h1 em { font-style: italic; font-weight: 500; color: #F3CF7A; }

  .phone {
    --h: 560px;
    position: absolute; height: var(--h); aspect-ratio: 1124 / 2444;
    background: #0A0A0D; border-radius: calc(var(--h) * .062); padding: calc(var(--h) * .0105);
    box-shadow: 0 0 0 1px #2C2C33, 0 30px 60px rgba(0, 0, 0, .55);
  }
  .phone .screen { width: 100%; height: 100%; overflow: hidden; border-radius: calc(var(--h) * .052); }
  .phone img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .a { right: 196px; top: 70px; transform: rotate(-6deg); }
  .b { right: 30px; top: 40px; --h: 520px; transform: rotate(6deg); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="src/prayerkey_mark.png"><span>PRAYERKEY</span></div>
    <h1>Pray <em>every</em> day.</h1>
  </div>
  <div class="phone b"><div class="screen"><img src="src/cover.png"></div></div>
  <div class="phone a"><div class="screen"><img src="src/home.png"></div></div>
</body>
</html>
